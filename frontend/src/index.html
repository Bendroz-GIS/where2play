<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="https://openlayers.org/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="./pages/styles/style.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200"/>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Teko:wght@300..700&display=swap" rel="stylesheet"><title>Where2Play</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  </head>
  <body>
    <header>
      <h1>Where2Play</h1>
      <div class="link-container">
        <a id="dashboard-link" class="header-button" ><span class="material-symbols-outlined">dashboard</span></a>
        <a id="login-link" class="header-button" ><span class="material-symbols-outlined">person</span></a>  
      </div>
      </header>
    <main>
      <section id="map-container" class="active">
        <div id="map"></div>
        <div id="button-container">
          <div id="operation-button-container"></div>
          <div id="basemap-button-container"></div>
        </div>
        
        <div id="form-container" ></div>
    
        <div id="popup-container"></div>
      </section>
      <section id="event">
        <div id="event-container">
        </div>
      </section>
      

    </main>
    
 

      

    <nav>
      <div class="link-container">
        <button class="active" id="map-page">
          <span class="material-symbols-outlined">map</span>
        </button>
        <button id="event-page">
          <span class="material-symbols-outlined">emoji_events</span>
        </button>
      </div>
    </nav>

    <div id="banner-container"></div>
    

    
    <script type="module" src="app.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/proj4js/2.7.5/proj4.js"></script>

  </body>
</html>
